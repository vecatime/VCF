name: Update Subscription

on:
  workflow_dispatch:
  schedule:
    - cron: "*/15 * * * *"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Download subscription
        run: |
          mkdir -p sub

          curl -fsSL \
            --retry 3 \
            --connect-timeout 15 \
            "https://veca1101.m-sedaghat9414.workers.dev/sub/all" \
            -o sub/all.new

          test -s sub/all.new
          mv sub/all.new sub/all

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add sub/all

          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi

          git commit -m "Update subscription"
          git push
